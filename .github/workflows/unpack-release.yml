name: Publish Voice Notes v3.4

on:
  push:
    branches: [main]
    paths:
      - ".release/READY"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part*.txt | base64 --decode > voice-notes-v3.4-netlify.zip
          unzip -t voice-notes-v3.4-netlify.zip

      - name: Publish application files into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-unpack
          mkdir .release-unpack
          unzip -q -o voice-notes-v3.4-netlify.zip -d .release-unpack
          cp -a .release-unpack/voice-notes/. .
          rm -rf .release-unpack
          rm -rf .release
          rm -f voice-notes-v3.4-netlify.zip

      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish Voice Notes v3.4 source"
          git push
